# Secret scanning (gitleaks >= 8.25). Used by .github/workflows/ci.yml on the full git history.
# Default rules + a narrow allowlist for the fake passwords used by the test fixtures.
# Keep it value-based: a global `paths` allowlist would skip whole files (gitleaks ignores
# `condition = "AND"` for path checks), so real secrets in tests would go unnoticed.

title = "effinance"

[extend]
useDefault = true

[[allowlists]]
description = "Fake passwords of the test fixtures (readable pt-BR values such as 'senha-forte-123')"
targetRules = ["generic-api-key"]
regexTarget = "match"
regexes = ['''(?i)password['"]?\s*:\s*['"][a-z0-9-]*senha[a-z0-9-]*['"]''']
