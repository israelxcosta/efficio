<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Full Referer only to this origin: paths with ids or tokens never reach other sites. -->
    <meta name="referrer" content="same-origin" />
    <meta name="theme-color" content="#152B61" />
    <meta name="description" content="Efficio — gestão financeira da empresa: clientes, honorários, fornecedores, contas a pagar e a receber e relatórios." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Efficio — Gestão financeira</title>
    <script>
      // Runs before the app modules (its sha256 is in the CSP: see src/lib/csp.ts).
      (function () {
        // Zod would probe `new Function('')` for its JIT; the CSP forbids eval, so use the interpreter.
        window.__zod_globalConfig = { jitless: true };
        // Apply the persisted theme before first paint to avoid a flash.
        try {
          var t = localStorage.getItem('effinance.theme') || 'system';
          var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
