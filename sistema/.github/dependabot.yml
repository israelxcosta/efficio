# Keeps the pins of the supply chain fresh: GitHub Actions SHAs, Docker base image digests and npm
# dependencies (pnpm lockfile). `cooldown` mirrors pnpm's minimumReleaseAge (pnpm-workspace.yaml):
# brand-new releases wait before being proposed. Security updates are not delayed by cooldown.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directories:
      - /apps/api
    schedule:
      interval: weekly
    cooldown:
      default-days: 3

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 3

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      prod-dependencies:
        dependency-type: production
        update-types: [patch]
