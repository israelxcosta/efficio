# Continuous integration — no deploy, no secrets.
# Supply chain (OWASP Top 10 CI/CD, OpenSSF Scorecard):
# - read-only GITHUB_TOKEN per job (top-level `permissions: {}`), checkout without persisted
#   credentials, `pull_request` only (never `pull_request_target` with untrusted code);
# - third-party actions pinned by full commit SHA (tag in the comment), container images by digest,
#   downloaded binaries verified by SHA-256;
# - pnpm version + hash from package.json#packageManager, `--frozen-lockfile`, no dependency cache
#   (avoids cache poisoning; enable `package-manager-cache` only if install time matters).
# Keep pins current with Dependabot (.github/dependabot.yml).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests and builds
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16.15-alpine3.24@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres # throwaway CI database, not a secret
          POSTGRES_DB: effinance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/effinance_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests (shared, web, API against Postgres)
        run: pnpm test
      - name: Build API
        run: pnpm --filter @effinance/api build
      - name: Build web (production and demo)
        run: |
          pnpm --filter @effinance/web exec vite build
          pnpm --filter @effinance/web exec vite build --mode demo
      - name: No source maps in the public web bundles
        run: |
          if find apps/web/dist apps/web/dist-demo -name '*.map' | grep -q .; then
            echo "::error::source maps found in the web build output"; exit 1
          fi

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # Reads pnpm-lock.yaml only (no install): production and development dependencies.
      - name: pnpm audit
        run: pnpm audit

  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum verified)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
      - name: gitleaks
        run: |
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner \
            --log-opts="--all" --exit-code 1 .

  image:
    name: API image (build only)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: docker build
        run: docker build -f apps/api/Dockerfile -t effinance-api:ci .
      - name: Image policy checks
        run: |
          test "$(docker image inspect -f '{{.Config.User}}' effinance-api:ci)" = "10001:10001"
          docker run --rm --read-only --cap-drop ALL --entrypoint sh effinance-api:ci -c '
            set -e
            test "$(id -u)" = 10001
            test ! -e dist/seed.js
            test -r /etc/ssl/certs/rds-ca-sa-east-1.pem
            if command -v npm || command -v corepack; then echo "package manager in runtime image"; exit 1; fi
            if touch dist/probe 2>/dev/null; then echo "application files are writable"; exit 1; fi
          '
